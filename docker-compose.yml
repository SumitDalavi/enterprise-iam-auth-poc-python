version: '3.8'

services:
  iam-service:
    build: .
    container_name: enterprise-iam-poc
    ports:
      - "8080:8080"
    env_file:
      - path: .env
        required: false
    environment:
      - SECRET_KEY=demo_secret_key_change_in_production
    volumes:
      - ./app:/app/app
    restart: always

  # ── Tier 2 Companion Services (started via: docker compose --profile live up) ──
  postgres:
    image: postgres:15-alpine
    profiles: ["live"]
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: iam_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    profiles: ["live"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
